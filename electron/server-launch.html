<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soren Launch</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI Variable", "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: #f5f5f5; }
    body { display: grid; place-items: center; padding: 0; background: #090909; }
    .panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 64px;
      background: #090909;
      border: 0;
      border-radius: 8px;
      box-shadow: none;
      text-align: center;
      opacity: 0;
      transform: translateY(5px) scale(.985);
      animation: intro .32s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .logo { width: 36px; height: 36px; object-fit: contain; filter: grayscale(1) brightness(2.1) contrast(1.2); opacity: .95; animation: breathe 2s ease-in-out infinite; }
    h1 { max-width: 100%; margin: 16px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 22px; line-height: 1.15; letter-spacing: -.025em; font-weight: 650; }
    .status { margin-top: 10px; color: #c7c7c7; font-size: 12.5px; line-height: 1.35; font-weight: 500; }
    .detail { min-height: 16px; max-width: 320px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #707070; font-size: 10.5px; line-height: 1.4; }
    .progress-wrap { width: min(300px, 72%); margin-top: 24px; }
    .progress-line { width: 100%; height: 2px; overflow: hidden; border-radius: 999px; background: #1c1c1c; }
    .progress { width: 0%; height: 100%; border-radius: inherit; background: #ededed; transition: width .4s cubic-bezier(.2,.8,.2,1); }
    .percent { margin-top: 7px; color: #5f5f5f; font-size: 10px; font-variant-numeric: tabular-nums; }
    body.finish .panel { animation: outro .25s ease forwards; }
    @keyframes intro { to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes outro { to { opacity: 0; transform: translateY(-3px) scale(.99); } }
    @keyframes breathe { 0%,100% { opacity: .82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.025); } }
  </style>
</head>
<body>
  <main class="panel">
    <img class="logo" src="../assets/soren-logo.png" alt="" />
    <h1 id="server">FiveM</h1>
    <div class="status" id="status">Preparing launch…</div>
    <div class="detail" id="detail"></div>
    <div class="progress-wrap">
      <div class="progress-line"><div class="progress" id="bar"></div></div>
      <div class="percent" id="percent">0%</div>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search)
    document.getElementById('server').textContent = params.get('server') || 'FiveM'
    window.sorenLaunchUpdate = ({ progress = 0, status = '', detail = '' } = {}) => {
      const value = Math.max(0, Math.min(100, Number(progress) || 0))
      document.getElementById('bar').style.width = `${value}%`
      document.getElementById('percent').textContent = `${Math.round(value)}%`
      if (status) document.getElementById('status').textContent = status
      document.getElementById('detail').textContent = detail || ''
    }
    window.sorenLaunchFinish = () => document.body.classList.add('finish')
  </script>
</body>
</html>
