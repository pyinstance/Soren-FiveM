<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'unsafe-inline'; img-src 'self' data:;" />
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:#0b090a;color:#f4eff0;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden}
    .wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #2d2023;background:#100c0d;border-radius:12px}
    img{width:57px;height:57px;object-fit:contain;margin-bottom:10px;animation:enter .28s cubic-bezier(.2,.75,.2,1) both}
    h1{font-size:16px;line-height:1;margin:0;font-weight:650;letter-spacing:-.02em}
    p{font-size:8px;color:#897b7e;margin:6px 0 14px}
    .line{width:108px;height:3px;border-radius:999px;background:#2a1d20;overflow:hidden}
    .line:after{content:"";display:block;width:34%;height:100%;border-radius:inherit;background:#8f2f3f;animation:load 1.05s ease-in-out infinite}
    .ver{position:absolute;bottom:10px;color:#66585b;font-size:7px}
    @keyframes enter{from{opacity:0;transform:translateY(3px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes load{0%{transform:translateX(-120%)}60%,100%{transform:translateX(330%)}}
    @media (prefers-reduced-motion:reduce){img,.line:after{animation:none}.line:after{width:100%;opacity:.6}}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="../assets/soren-logo.png" alt="" />
    <h1>Soren FiveM</h1>
    <p>Preparing library</p>
    <div class="line"></div>
    <span class="ver">v1.8.0</span>
  </div>
</body>
</html>
